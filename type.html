<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justType</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="type-area" id="type-area">
        <h1 id="test-title">...start typing whenever you are ready</h1>
        <div id="timer" class="timer" hidden></div>
        <div id="word-display"></div>
        <input autocomplete="off" type="text" id="typing-input" onblur="this.focus()" autofocus/>
    
        <div id="result-modal" class="modal">
            <div class="modal-content">
                <div id="result-text" class="result-text">
                    <span id="cpm"></span>
                    <span id="wpm"></span>
                    <span id="accuracy"></span>
                </div>
                <div class="result-text result-details">
                    <span id="time"></span>
                    <span id="mistakes"></span>
                </div>
            </div>
        </div>
        
    </div>
    <div class="instruction-container" id="instruction-container">
        <span class="hint"><kbd>tab</kbd> - restart test</span>
        <span class="hint"><kbd>esc</kbd> - back to home</span>
        <span class="hint"><kbd>enter</kbd> - new test</span>
    </div>
    <script src="js/test.js" defer></script>
</body>
</html>
