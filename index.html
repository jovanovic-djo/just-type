<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
        <title>justType</title>
        <link rel="stylesheet" type="text/css" href="css/style.css" />
        <script src="js/theme.js"></script>
    </head>
<body>
    <div class="header">
        <div class="social-media">
            <div class="social-item">
                <a href="https://github.com/jovanovic-djo" target="_blank">
                    <img src="img/github.png" alt="GitHub" />
                </a>
            </div>
            <div class="social-item">
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
                    <img src="img/youtube.png" alt="YouTube" />
                </a>
            </div>
        </div>
        <div id="theme-switch" class="theme-switch">
            <label class="switch">
                <input type="checkbox" id="theme-toggle" aria-label="Dark theme">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <h1>just.Type</h1>
    <form action="type.html" method="GET" autocomplete="off">
        <div class="wrapper-left">
            <fieldset class="choice language-choice" id="language-choice">
                <legend class="visually-hidden">Language</legend>
                <input type="radio" id="language-english" name="language" value="english" checked="checked" />
                <label for="language-english">English</label>

                <input type="radio" id="language-german" name="language" value="german" />
                <label for="language-german">German</label>

                <input type="radio" id="language-serbian" name="language" value="serbian"/>
                <label for="language-serbian">Serbian</label>

                <input type="radio" id="language-french" name="language" value="french"/>
                <label for="language-french">French</label>

                <input type="radio" id="language-spanish" name="language" value="spanish"/>
                <label for="language-spanish">Spanish</label>

                <input type="radio" id="language-lorem" name="language" value="lorem" />
                <label for="language-lorem">Lorem</label>
            </fieldset>
        </div>
        <fieldset class="accent-choice" id="accent-choice">
            <legend class="visually-hidden">Accents</legend>
            <div class="switch-wrap">
                <input type="radio" id="accent-on" name="accent" value="on" checked="checked" aria-label="Keep accents" />
                <label for="accent-on">ČÜß</label>
            </div>
            <div class="switch-wrap">
                <input type="radio" id="accent-off" name="accent" value="off" aria-label="Remove accents" />
                <label for="accent-off">CUSS</label>  
            </div>
        </fieldset>
        <div class="wrapper-right">
            <fieldset class="choice topic-choice" id="topic-choice">
                <legend class="visually-hidden">Topic</legend>
                <input type="radio" id="topic-none" name="topic" value="none" checked="checked" />
                <label for="topic-none">None</label>

                <input type="radio" id="topic-numbers" name="topic" value="numbers" />
                <label for="topic-numbers">Numbers</label>

                <input type="radio" id="topic-animals" name="topic" value="animals" />
                <label for="topic-animals">Animals</label>

                <input type="radio" id="topic-food" name="topic" value="food" />
                <label for="topic-food">Food</label>

                <input type="radio" id="topic-objects" name="topic" value="objects" />
                <label for="topic-objects">Objects</label>  

                <input type="radio" id="topic-quotes" name="topic" value="quotes" />
                <label for="topic-quotes">Quotes</label>                   
            </fieldset>
        </div>
        <div class="wrapper-left">
            <fieldset class="choice complexity-choice" id="complexity-choice">
                <legend class="visually-hidden">Difficulty</legend>
                <input type="radio" id="complexity-low" name="complexity" value="low" checked="checked" />
                <label for="complexity-low">Easy</label>

                <input type="radio" id="complexity-mid" name="complexity" value="mid"/>
                <label for="complexity-mid">Mid</label>
                
                <input type="radio" id="complexity-high" name="complexity" value="high"/>
                <label for="complexity-high">Hard</label>
                
                <input type="radio" id="complexity-insane" name="complexity" value="insane"/>
                <label for="complexity-insane">Insane</label>
            </fieldset>
        </div>
        <div class="wrapper-right mode-wrapper">
            <fieldset class="choice mode-choice" id="mode-choice">
                <legend class="visually-hidden">Mode</legend>
                <input type="radio" id="mode-words" name="mode" value="words" checked="checked" />
                <label for="mode-words">Words</label>

                <input type="radio" id="mode-time" name="mode" value="time" />
                <label for="mode-time">Time</label>
            </fieldset>
            <fieldset class="choice mode-value-choice" id="mode-value-choice">
                <legend class="visually-hidden">Number of words</legend>
                <input type="radio" id="mode-value-5" name="mode-value" value="5" checked="checked" />
                <label for="mode-value-5">5</label>

                <input type="radio" id="mode-value-10" name="mode-value" value="10"/>
                <label for="mode-value-10">10</label>

                <input type="radio" id="mode-value-15" name="mode-value" value="15"/>
                <label for="mode-value-15">15</label>

                <input type="radio" id="mode-value-30" name="mode-value" value="30" />
                <label for="mode-value-30">30</label>
            </fieldset>
            <fieldset class="choice time-value-choice" id="time-value-choice" hidden>
                <legend class="visually-hidden">Seconds</legend>
                <input type="radio" id="time-value-15" name="time-value" value="15" />
                <label for="time-value-15">15s</label>

                <input type="radio" id="time-value-30" name="time-value" value="30" checked="checked" />
                <label for="time-value-30">30s</label>

                <input type="radio" id="time-value-60" name="time-value" value="60" />
                <label for="time-value-60">60s</label>

                <input type="radio" id="time-value-120" name="time-value" value="120" />
                <label for="time-value-120">120s</label>
            </fieldset>
        </div>          
        <div class="button-container">
            <button class="start-test" type="submit" id="start-test">START</button>
        </div>
    </form>
    <div class="instruction-container">
        <span class="hint"><kbd>tab</kbd> - restart test</span>
        <span class="hint"><kbd>esc</kbd> - back to home</span>
        <span class="hint"><kbd>enter</kbd> - new test</span>
    </div>
    <script src="js/home.js" defer></script>
</body>
</html>
